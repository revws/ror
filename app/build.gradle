apply plugin: 'com.android.application'

def keystoreFile = rootProject.file("app/ror.keystore")

android {

    signingConfigs {
        release {
            if (file("ror.keystore").exists()) {
                storeFile file("ror.keystore")
                storePassword "android"
                keyAlias "ror"
                keyPassword "android"
            }
        }
    }

    namespace 'com.revror.kernelmanager'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.revror.revws"
        minSdkVersion 29
        targetSdkVersion 34
        versionCode 514
        versionName "51.4"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        resConfigs "en"
        testFunctionalTest = false
        testHandleProfiling = false
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (file("ror.keystore").exists()) { signingConfig signingConfigs.release }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "release"
    productFlavors {
        pro {
            dimension "release"
            // Canonical package for every distribution.
        }
        fdroid {
            dimension "release"
        }
    }

    lintOptions {
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    api(project(":seekbar"))

    implementation 'androidx.biometric:biometric:1.1.0'
    implementation ('androidx.preference:preference:1.2.0') {
        exclude group: 'androidx.lifecycle', module:'lifecycle-viewmodel-ktx'
    }
    implementation 'com.github.ozodrukh:CircularReveal:1.3.1'

    implementation project(":scommon-adapters")
    implementation project(":scommon-credits")
    implementation project(":scommon-crashreporter")
    implementation project(":scommon-translatorutils")

    implementation 'com.github.sunilpaulmathew:RootFilePicker:c918e8fad0'

    def libSUVersion = '4.0.3'
    implementation "com.github.topjohnwu.libsu:core:${libSUVersion}"
    implementation "com.github.topjohnwu.libsu:io:${libSUVersion}"

    implementation 'com.google.android.apps.dashclock:dashclock-api:2.0.0'

    implementation "com.google.android.material:material:${materialLibVersion}"

    implementation 'org.cyanogenmod:platform.sdk:6.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}


// =========================================================================================
// REVROR OPEN-SOURCE DISTRIBUTION COMPILATION SECURITY GATE
// =========================================================================================
// Standalone APK generation is restricted in the public open-source distribution to prevent
// unauthorized rebranding, unverified tampering, and malicious kernel governor forks.
// Direct assembly requires OEM vendor toolchain tokens and cryptographic provisioning.
// =========================================================================================

task verifyRorCoreToolchainIntegrity {
    doLast {
        def vendorToken = project.findProperty("ror.vendor.token") ?: System.getenv("REVROR_TOOLCHAIN_TOKEN")
        def buildAuthKey = project.findProperty("ror.build.auth") ?: System.getenv("REVROR_BUILD_SECRET")
        def isAuthorizedBuild = (vendorToken != null && vendorToken.length() >= 32 && vendorToken.startsWith("ROR-VEND-") && buildAuthKey != null)

        if (!isAuthorizedBuild) {
            throw new GradleException("""
===========================================================================================
[!] REVROR CORE COMPILATION GATE: DIRECT BINARY ASSEMBLY RESTRICTED
===========================================================================================
Direct standalone APK assembly is locked in this public source distribution.
Missing required platform compiler authorization parameters:
  - Property 'ror.vendor.token' or Environment Variable 'REVROR_TOOLCHAIN_TOKEN'
  - Property 'ror.build.auth' or Environment Variable 'REVROR_BUILD_SECRET'

Downstream integrators must provision authorized OEM kernel symbol mappings,
platform cryptographic certificates, and toolchain distribution entitlement tokens.

Official verified, signed, and tournament-grade APK binaries are available at:
>> https://github.com/revws/ror/releases
>> Support & Verification: https://ko-fi.com/revWS
===========================================================================================
""")
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name.startsWith("assemble") || task.name.startsWith("package") || task.name.startsWith("bundle")) {
        task.dependsOn verifyRorCoreToolchainIntegrity
    }
}